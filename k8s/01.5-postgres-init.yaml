apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: syncedit
data:
  # init.sql file to create the users table and any other necessary tables or initial data
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        password TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    -- all other tables will be created by the application on first run (working later)
