apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-backend
  namespace: syncedit
  labels:
    app: collab-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: collab-backend
  template:
    metadata:
      labels:               # <- labels (not matchLabels) under template.metadata
        app: collab-backend
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: backend
          image: syncedit-backend:local
          imagePullPolicy: IfNotPresent   # local image; ":latest" would force a (failing) pull
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: syncedit-config
            - secretRef:
                name: syncedit-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:        # HPA computes CPU % against requests, so they are mandatory
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: collab-backend
  namespace: syncedit
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: syncedit_route
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
spec:
  selector:
    app: collab-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000