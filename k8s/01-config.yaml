apiVersion: v1
kind: ConfigMap
metadata:
  name: syncedit-config
  namespace: syncedit
data:
  BASE_PORT: "5000"
  BASE_URL: "http://syncedit.local"
  CLIENT_ORIGINS: "http://syncedit.local"
  CLIENT_ORIGIN: "http://syncedit.local"
  REDIS_URL: "redis://redis:6379"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "rajeusr"
  DB_NAME: "livecode"
  DATABASE_SSL: "false"
  NODE_ENV: "development"
---
apiVersion: v1
kind: Secret
metadata:
  name: syncedit-secret
  namespace: syncedit
type: Opaque
stringData:
  DB_PASSWORD: "local-dev-db-password"
  JWT_SECRET: "local-dev-jwt-secret-change-me"
  COOKIE_SECRET: "local-dev-cookie-secret-change-me"